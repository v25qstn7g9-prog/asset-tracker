const nf = (n) => (n ?? 0).toLocaleString("zh-TW", { maximumFractionDigits: 0 });

// A categorical XAxis (dataKey pointing at a string) spaces every point
// evenly by ARRAY INDEX, never by real elapsed time. That's invisible when
// records are evenly spaced, but this app's history mixes a handful of
// sparse quarterly snapshots (2021-2024) with dense near-daily records
// (2025-2026): ~14 old points vs ~80 recent ones. Index-spacing squeezes
// those 3+ sparse years into a sliver near the left edge and stretches the
// last ~14 months across almost the entire chart — years of real history
// look "short", and the line connecting the sparse old points draws a fake
// smooth ramp that isn't really there. Picking better tick *labels* (the
// previous fix here) can't correct this: labels just get relabeled at
// whatever index position their date happens to fall on.
// The real fix is a numeric time-scaled axis: chartData now carries a "t"
// timestamp, the XAxis uses type="number" with a dataMin/dataMax domain, so
// pixel position is proportional to actual elapsed time. pickEvenTimeTicks
// just returns evenly spaced timestamps to label — no snapping to existing
// data needed, since a continuous numeric axis can place a tick anywhere.
function pickEvenTimeTicks(data, key, count = 6) {
  if (!data || data.length === 0) return [];
  const minT = data[0][key], maxT = data[data.length - 1][key];
  if (minT === maxT) return [minT];
  const ticks = [];
  for (let i = 0; i < count; i++) {
    ticks.push(Math.round(minT + ((maxT - minT) * i) / (count - 1)));
  }
  return ticks;
}
function formatTickDate(t) {
  const d = new Date(t);
  const y = String(d.getFullYear()).slice(2);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

const pf = (n) => `${n >= 0 ? "+" : ""}${(n ?? 0).toFixed(2)}%`;

// Lazily injects the SheetJS (xlsx) library the first time Excel export is
// actually used, instead of loading it eagerly on every page load. This
// keeps a large third-party script fully off the critical boot path — if
// it fails to load for any reason, only the Excel button is affected, not
// the rest of the app. Cached at module scope (not component state) so a
// second click reuses the same in-flight/completed load instead of
// injecting the script tag again.
let xlsxLoadPromise = null;
function loadXLSXLibrary() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    script.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error("XLSX 載入後仍無法使用")));
    script.onerror = () => reject(new Error("XLSX 函式庫載入失敗，請確認網路連線"));
    document.head.appendChild(script);
  }).catch((err) => { xlsxLoadPromise = null; throw err; }); // allow retry on next click if it failed
  return xlsxLoadPromise;
}

// Animates a number counting up/down to its new value instead of jumping
// instantly — used for the big "目前總資產" figure so a live-price refresh
// feels like something happened rather than a silent swap.
function AnimatedNumber({ value, prefix = "" }) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(value);
  const rafRef = useRef(null);
  useEffect(() => {
    const from = fromRef.current;
    const to = value;
    if (from === to) return;
    const duration = 500;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      setDisplay(Math.round(from + (to - from) * eased));
      if (t < 1) rafRef.current = requestAnimationFrame(tick);
      else fromRef.current = to;
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [value]);
  return <span>{prefix}{nf(display)}</span>;
}

// ---------- date helpers ----------
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d || 1);
}
function monthsBetween(dateA, dateB) {
  const a = parseLocalDate(dateA), b = parseLocalDate(dateB);
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth())
    + (b.getDate() - a.getDate()) / 30;
}
function addMonths(dateStr, n) {
  const d = parseLocalDate(dateStr);
  d.setMonth(d.getMonth() + Math.round(n));
  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}
// build a monthly projection schedule: month 0 = start date
function buildSchedule({ startDate, initialCapital, monthlyAmount, annualReturn, horizonMonths }) {
  const rm = Math.pow(1 + (annualReturn / 100), 1 / 12) - 1;
  const rows = [{ index: 0, principal: initialCapital, assets: initialCapital }];
  for (let i = 1; i <= horizonMonths; i++) {
    const prev = rows[i - 1];
    rows.push({
      index: i,
      principal: prev.principal + monthlyAmount,
      assets: prev.assets * (1 + rm) + monthlyAmount,
    });
  }
  return rows;
}
// find the first schedule index whose `key` value reaches `target`, with linear interpolation
// Whether it's currently within TWSE trading hours (weekdays 09:00–13:30,
// using the device's local time — fine since this app is used in Taiwan).
// Only checks weekday + time window; it doesn't know about public holidays,
// so a market holiday will still count as "open" here and the auto-refresh
// will fire a few extra times that day — harmless, just not perfectly precise.
function isTwseTradingHours(date = new Date()) {
  const day = date.getDay(); // 0 = Sunday, 6 = Saturday
  if (day === 0 || day === 6) return false;
  const minutes = date.getHours() * 60 + date.getMinutes();
  return minutes >= 9 * 60 && minutes <= 13 * 60 + 30;
}

function findCrossing(schedule, key, target) {
  if (!schedule.length) return null;
  if (target <= schedule[0][key]) return { index: 0 };
  for (let i = 1; i < schedule.length; i++) {
    if (schedule[i][key] >= target) {
      const prev = schedule[i - 1][key], cur = schedule[i][key];
      const frac = cur === prev ? 0 : (target - prev) / (cur - prev);
      return { index: i - 1 + frac };
    }
  }
  return { index: schedule.length - 1, beyond: true };
}

// ---------- live price helpers (Cloudflare Pages Function) ----------
// The front end sends the symbols that are actually held to the same-origin
// /quote endpoint. Cloudflare then talks to TWSE/Yahoo server-side, so the
// browser no longer needs any public CORS proxy.
async function fetchQuotesWithFallback(symbols) {
  if (!Array.isArray(symbols) || !symbols.length) return {};
  const unique = [...new Set(symbols.map((s) => String(s).trim().toUpperCase()).filter(Boolean))];
  const url = `/quote?symbols=${encodeURIComponent(unique.join(","))}&_ts=${Date.now()}`;
  const res = await fetch(url, { cache: "no-store" });
  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`報價 API 回傳格式錯誤（HTTP ${res.status}）`);
  }
  if (!res.ok || !data?.ok || !data?.quotes) {
    throw new Error(data?.error || `報價 API 失敗（HTTP ${res.status}）`);
  }
  return data.quotes;
}


// ---------- storage helpers ----------
async function loadKey(key, fallback) {
  try {
    if (window.storage?.get) {
      const res = await window.storage.get(key, false);
      if (res?.value) return JSON.parse(res.value);
    }
    const local = window.localStorage?.getItem(key);
    return local ? JSON.parse(local) : fallback;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  const payload = JSON.stringify(value);
  let saved = false;
  try {
    if (window.storage?.set) {
      await window.storage.set(key, payload, false);
      saved = true;
    }
  } catch (e) {
    console.warn("window.storage save failed", key, e);
  }
  try {
    window.localStorage?.setItem(key, payload);
    saved = true;
  } catch (e) {
    console.warn("localStorage save failed", key, e);
  }
  if (!saved) console.error("storage save failed", key);
}

function isObject(v) {
  return v != null && typeof v === "object" && !Array.isArray(v);
}

function validateBackupPayload(payload) {
  if (!isObject(payload)) return false;
  const data = isObject(payload.data) ? payload.data : payload;
  return Array.isArray(data.dailyRecords)
    && Array.isArray(data.holdings)
    && Array.isArray(data.trades)
    && Array.isArray(data.dividends)
    && Array.isArray(data.planItems)
    && isObject(data.goal)
    && isObject(data.planSchedule);
}

// ---- seed data imported from user's Excel (存股現況表) ----

const DAILY_SEED = [];

function AssetTracker() {
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("dashboard");
  // Set (with a fresh object each time so the effect in DailyPanel re-fires
  // even if the same number is sent twice) when "記錄為今日資產" is pressed
  // on the dashboard — carries the fetched TW market value over to the
  // 每日紀錄 form so the user can add the US-side value and confirm together.
  const [dailyPrefill, setDailyPrefill] = useState(null);
  // Lifted out of DailyPanel itself: that panel only renders while
  // tab === "daily", so a useState inside it gets wiped every time you
  // switch away and back (e.g. going to 總覽 to fill market value, then to
  // 交易紀錄 to fill cost — each visit was resetting whatever the other one
  // had just filled in). Owning it here means it survives tab switches.
  const [dailyForm, setDailyForm] = useState({ date: todayStr(), twValue: "", usValue: "", twCost: "", usCost: "" });

  const [dailyRecords, setDailyRecords] = useState([]);
  const [holdings, setHoldings] = useState([]);
  const [trades, setTrades] = useState([]);
  const [dividends, setDividends] = useState([]);
  const [planItems, setPlanItems] = useState([]);
  const [goal, setGoal] = useState({ targetAmount: 10000000, targetYear: 2035 });
  const [planSchedule, setPlanSchedule] = useState(defaultPlanSchedule());
  // Starting cost basis, before any trade in the 交易紀錄 log — combined
  // with the running buy/sell total to get today's accumulated cost.
  const [costBasis, setCostBasis] = useState({ startingCost: 0 });

  // ---- initial load ----
  useEffect(() => {
    (async () => {
      const [dr, h, t, dv, p, g, ps, cb] = await Promise.all([
        loadKey("dailyRecords", defaultDailyRecords()),
        loadKey("holdings", defaultHoldings()),
        loadKey("trades", defaultTrades()),
        loadKey("dividends", defaultDividends()),
        loadKey("planItems", defaultPlan()),
        loadKey("goal", { targetAmount: 10000000, targetYear: 2035 }),
        loadKey("planSchedule", defaultPlanSchedule()),
        loadKey("costBasis", { startingCost: 0 }),
      ]);
      setDailyRecords(dr);
      setHoldings(h);
      setTrades(t);
      setDividends(dv);
      setPlanItems(p);
      setGoal(g);
      setPlanSchedule(ps);
      setCostBasis(cb);
      setReady(true);
    })();
  }, []);

  // ---- persist on change (after ready) ----
  useEffect(() => { if (ready) saveKey("dailyRecords", dailyRecords); }, [dailyRecords, ready]);
  useEffect(() => { if (ready) saveKey("holdings", holdings); }, [holdings, ready]);
  useEffect(() => { if (ready) saveKey("trades", trades); }, [trades, ready]);
  useEffect(() => { if (ready) saveKey("dividends", dividends); }, [dividends, ready]);
  useEffect(() => { if (ready) saveKey("planItems", planItems); }, [planItems, ready]);
  useEffect(() => { if (ready) saveKey("goal", goal); }, [goal, ready]);
  useEffect(() => { if (ready) saveKey("planSchedule", planSchedule); }, [planSchedule, ready]);
  useEffect(() => { if (ready) saveKey("costBasis", costBasis); }, [costBasis, ready]);


  // ---- full backup / restore ----
  const exportBackup = () => {
    const payload = {
      app: "存股資產追蹤",
      appVersion: APP_VERSION,
      schemaVersion: BACKUP_SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      data: { dailyRecords, holdings, trades, dividends, planItems, goal, planSchedule },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `存股資產追蹤_備份_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const exportExcel = async () => {
    let XLSX;
    try {
      XLSX = await loadXLSXLibrary();
    } catch (e) {
      window.alert("Excel 匯出元件載入失敗，請確認網路後再試一次。");
      return;
    }

    const wb = XLSX.utils.book_new();

    const dailyRows = [...dailyRecords]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((r) => ({
        日期: r.date,
        台股市值: Number(r.twValue || 0),
        美股市值: Number(r.usValue || 0),
        總市值: Number(r.twValue || 0) + Number(r.usValue || 0),
        台股成本: Number(r.twCost || 0),
        美股成本: Number(r.usCost || 0),
        總成本: Number(r.twCost || 0) + Number(r.usCost || 0),
      }));

    const tradeRows = [...trades]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((t) => ({
        日期: t.date,
        代號: t.symbol,
        買賣: t.action === "buy" ? "買" : "賣",
        股數: Number(t.shares || 0),
        成交價: Number(t.price || 0),
        手續費: Number(t.fee || 0),
        交易稅: Number(t.tax || 0),
        交易金額: Number(t.amount || 0),
        備註: t.note || "",
      }));

    const dividendRows = [...dividends]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((d) => ({
        除息日: d.date,
        代號: d.symbol,
        股數: Number(d.shares || 0),
        每股配息: Number(d.perShare || 0),
        配息總額: Number(d.amount || 0),
      }));

    const holdingRows = holdings.map((h) => {
      const netShares = trades
        .filter((t) => t.symbol === h.symbol)
        .reduce((sum, t) => sum + (t.action === "buy" ? Number(t.shares || 0) : -Number(t.shares || 0)), 0);
      const current = Number(h.initialShares || 0) + netShares;
      const target = Number(h.target2035 || 0);
      return {
        代號: h.symbol,
        名稱: h.name || "",
        期初股數: Number(h.initialShares || 0),
        目前股數: current,
        "2035目標股數": target,
        尚缺股數: Math.max(0, target - current),
        達成率: target > 0 ? current / target : 0,
      };
    });

    const planRows = planItems.map((p) => ({
      代號: p.symbol,
      每月投入: Number(p.amount || 0),
      備註: p.note || "",
    }));

    const summaryRows = [
      { 項目: "匯出日期", 資料: todayStr() },
      { 項目: "App版本", 資料: APP_VERSION },
      { 項目: "退休目標金額", 資料: Number(goal.targetAmount || 0) },
      { 項目: "退休目標年份", 資料: Number(goal.targetYear || 0) },
      { 項目: "起始成本", 資料: Number(costBasis?.startingCost || 0) },
      { 項目: "目前累積成本", 資料: Number(accumulatedCost || 0) },
      { 項目: "累積配息", 資料: dividends.reduce((sum, d) => sum + Number(d.amount || 0), 0) },
    ];

    const addSheet = (name, rows, widths) => {
      const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 資料: "尚無紀錄" }]);
      if (widths) ws["!cols"] = widths.map((wch) => ({ wch }));
      XLSX.utils.book_append_sheet(wb, ws, name);
    };

    addSheet("摘要", summaryRows, [20, 20]);
    addSheet("每日紀錄", dailyRows, [12, 14, 14, 14, 14, 14, 14]);
    addSheet("交易紀錄", tradeRows, [12, 10, 8, 10, 10, 10, 10, 14, 28]);
    addSheet("配息紀錄", dividendRows, [12, 10, 12, 12, 14]);
    addSheet("持股進度", holdingRows, [10, 18, 12, 12, 14, 12, 12]);
    addSheet("計畫設定", planRows, [10, 14, 28]);

    // 持股進度的達成率欄改成 Excel 百分比格式。
    const holdingSheet = wb.Sheets["持股進度"];
    if (holdingSheet && holdingRows.length) {
      for (let row = 2; row <= holdingRows.length + 1; row++) {
        const cell = holdingSheet[`G${row}`];
        if (cell) cell.z = "0.0%";
      }
    }

    XLSX.writeFile(wb, `存股資產追蹤_${todayStr()}.xlsx`);
  };

  const importBackup = async (file) => {
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      if (!validateBackupPayload(payload)) {
        window.alert("這不是有效的存股資產追蹤備份檔。資料未變更。");
        return;
      }
      if (!window.confirm("匯入會以備份內容取代目前 App 內的資料，確定要繼續嗎？")) return;
      const data = payload.data || payload;
      setDailyRecords(data.dailyRecords);
      setHoldings(data.holdings);
      setTrades(data.trades);
      setDividends(data.dividends);
      setPlanItems(data.planItems);
      setGoal(data.goal);
      setPlanSchedule(data.planSchedule);
      window.alert("備份已匯入完成。建議重新整理一次頁面確認資料。");
    } catch (e) {
      console.error("backup import failed", e);
      window.alert("備份檔讀取失敗，資料未變更。");
    }
  };

  // ---- derived ----
  const sortedDaily = useMemo(
    () => [...dailyRecords].sort((a, b) => a.date.localeCompare(b.date)),
    [dailyRecords]
  );
  const latest = sortedDaily[sortedDaily.length - 1];
  const prev = sortedDaily[sortedDaily.length - 2];
  const totalToday = latest ? latest.twValue + latest.usValue : 0;
  const totalPrev = prev ? prev.twValue + prev.usValue : null;
  const dailyChange = totalPrev != null ? totalToday - totalPrev : 0;
  const dailyChangePct = totalPrev ? (dailyChange / totalPrev) * 100 : 0;

  const tradesInvested = trades.reduce(
    (s, t) => s + (t.action === "buy" ? t.amount : -t.amount), 0
  );
  // Running cost basis: starting cost plus every buy (+) / sell (-) since.
  const accumulatedCost = Number(costBasis.startingCost || 0) + tradesInvested;
  // 目前持倉成本優先取自「每日紀錄」的台股成本+美股成本
  // 沒有填成本欄位時，才退回用交易紀錄淨買入金額估算
  const latestCost = latest ? (latest.twCost || 0) + (latest.usCost || 0) : 0;
  const totalInvested = latestCost > 0 ? latestCost : tradesInvested;
  const totalDividends = dividends.reduce((s, d) => s + d.amount, 0);
  const capitalGain = totalToday - totalInvested;
  const totalReturn = capitalGain + totalDividends;
  const totalReturnPct = totalInvested ? (totalReturn / totalInvested) * 100 : 0;

  const highPoint = sortedDaily.reduce((max, r) => {
    const v = r.twValue + r.usValue;
    return v > max.value ? { value: v, date: r.date } : max;
  }, { value: -Infinity, date: null });
  const drawdown = highPoint.value > 0 ? ((totalToday - highPoint.value) / highPoint.value) * 100 : 0;

  const chartData = sortedDaily.map((r) => ({
    date: r.date.slice(2),
    t: new Date(r.date).getTime(),
    total: r.twValue + r.usValue,
  }));

  // "今年以來(YTD)" — market-value change since the start of the current
  // calendar year. Like the other stat cards, this is value-based, not a
  // cost-adjusted/time-weighted return: it doesn't separate new
  // contributions from investment gains. Baseline is the last record on or
  // before Jan 1 of this year; if tracking only started sometime this year,
  // falls back to the very first record so the number stays meaningful.
  const ytdBase = (() => {
    const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
    let base = null;
    for (let i = chartData.length - 1; i >= 0; i--) {
      if (chartData[i].t <= yearStart) { base = chartData[i]; break; }
    }
    return base || chartData[0] || null;
  })();
  const ytdGain = ytdBase ? totalToday - ytdBase.total : 0;
  const ytdPct = ytdBase && ytdBase.total ? (ytdGain / ytdBase.total) * 100 : 0;

  const holdingsWithShares = useMemo(() => holdings.map((h) => {
    const bought = trades.filter((t) => t.symbol === h.symbol && t.action === "buy")
      .reduce((s, t) => s + t.shares, 0);
    const sold = trades.filter((t) => t.symbol === h.symbol && t.action === "sell")
      .reduce((s, t) => s + t.shares, 0);
    const current = h.initialShares + bought - sold;
    const pct = h.target2035 ? Math.min(100, (current / h.target2035) * 100) : 0;
    return { ...h, bought, sold, current, pct };
  }), [holdings, trades]);

  const planTotal = planItems.reduce((s, p) => s + Number(p.amount || 0), 0);

  const schedule = useMemo(() => buildSchedule(planSchedule), [planSchedule]);
  const principalCrossing = useMemo(
    () => findCrossing(schedule, "principal", totalInvested), [schedule, totalInvested]
  );
  const assetCrossing = useMemo(
    () => findCrossing(schedule, "assets", totalToday), [schedule, totalToday]
  );
  // Same schedule, but against the stated goal amount instead of today's
  // asset total — gives an estimated goal-completion date to show in the
  // header, reusing the same projection already used in "計畫進度".
  const goalCrossing = useMemo(
    () => findCrossing(schedule, "assets", goal.targetAmount), [schedule, goal.targetAmount]
  );
  const goalDate = goalCrossing && !goalCrossing.beyond
    ? addMonths(planSchedule.startDate, goalCrossing.index) : null;
  const elapsedMonths = monthsBetween(planSchedule.startDate, latest ? latest.date : todayStr());
  const leadMonths = (principalCrossing && assetCrossing)
    ? principalCrossing.index - assetCrossing.index : null;

  // Milestone celebration: show a one-time toast the first time total assets
  // cross 50% / 80% / 100% of the goal. celebratedMilestones is persisted so
  // it doesn't fire again on every reload once a milestone has been hit.
  const [celebratedMilestones, setCelebratedMilestones] = useState(null); // null = not loaded yet
  const [celebration, setCelebration] = useState(null);
  useEffect(() => {
    (async () => {
      const saved = await loadKey("celebratedMilestones", []);
      setCelebratedMilestones(saved);
    })();
  }, []);
  useEffect(() => {
    if (!ready || celebratedMilestones === null || !goal.targetAmount) return;
    const pct = (totalToday / goal.targetAmount) * 100;
    const milestones = [50, 80, 100];
    const next = milestones.find((m) => pct >= m && !celebratedMilestones.includes(m));
    if (next) {
      const updated = [...celebratedMilestones, next];
      setCelebratedMilestones(updated);
      saveKey("celebratedMilestones", updated);
      setCelebration(next);
      setTimeout(() => setCelebration(null), 3200);
    }
  }, [totalToday, goal.targetAmount, ready, celebratedMilestones]);

  if (!ready) {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.sub }}
        className="min-h-screen flex items-center justify-center gap-2 font-sans">
        <Loader2 className="animate-spin" size={20} />
        <span>載入中…</span>
      </div>
    );
  }

  return (
    <div style={{ background: COLORS.bg, color: COLORS.text }}
      className="min-h-screen font-sans pb-24">
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
        * { font-family: 'Noto Sans TC', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes celebrate-in {
          0% { opacity: 0; transform: translate(-50%, -12px) scale(0.9); }
          100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
      `}</style>

      {celebration && (
        <div className="fixed top-4 left-1/2 z-50 px-5 py-3 rounded-2xl text-sm font-bold flex items-center gap-2"
          style={{
            transform: "translateX(-50%)", background: COLORS.gold, color: COLORS.bg,
            boxShadow: "0 8px 24px rgba(0,0,0,0.4)", animation: "celebrate-in 0.35s ease-out",
          }}>
          🎉 已達成目標 {celebration}%！
        </div>
      )}

      <Header goal={goal} totalToday={totalToday} goalDate={goalDate} />

      <main className="px-4 pt-4 pb-24 max-w-2xl mx-auto">
        {tab === "dashboard" && (
          <Dashboard
            totalToday={totalToday} dailyChange={dailyChange} dailyChangePct={dailyChangePct}
            capitalGain={capitalGain} totalDividends={totalDividends} totalReturn={totalReturn}
            totalReturnPct={totalReturnPct} highPoint={highPoint} drawdown={drawdown}
            ytdGain={ytdGain} ytdPct={ytdPct}
            chartData={chartData} goal={goal} totalInvested={totalInvested}
            holdings={holdingsWithShares}
            onFillDailyTw={(value) => { setDailyPrefill({ twValue: value, nonce: Date.now() }); setTab("daily"); }}
          />
        )}
        {tab === "daily" && (
          <DailyPanel records={sortedDaily} setRecords={setDailyRecords} prefill={dailyPrefill}
            form={dailyForm} setForm={setDailyForm} />
        )}
        {tab === "holdings" && (
          <HoldingsPanel holdings={holdingsWithShares} setHoldings={setHoldings} />
        )}
        {tab === "trades" && (
          <TradesPanel trades={trades} setTrades={setTrades} holdings={holdings}
            costBasis={costBasis} setCostBasis={setCostBasis} accumulatedCost={accumulatedCost}
            onFillDailyCost={(value) => { setDailyPrefill({ twCost: value, nonce: Date.now() }); setTab("daily"); }}
          />
        )}
        {tab === "dividends" && (
          <DividendsPanel dividends={dividends} setDividends={setDividends} holdings={holdingsWithShares} />
        )}
        {tab === "plan" && (
          <PlanPanel planItems={planItems} setPlanItems={setPlanItems}
            planTotal={planTotal} goal={goal} setGoal={setGoal}
            exportBackup={exportBackup} importBackup={importBackup} exportExcel={exportExcel} />
        )}
        {tab === "progress" && (
          <ProgressPanel
            planSchedule={planSchedule} setPlanSchedule={setPlanSchedule}
            planTotal={planTotal} schedule={schedule}
            totalInvested={totalInvested} totalToday={totalToday}
            principalCrossing={principalCrossing} assetCrossing={assetCrossing}
            elapsedMonths={elapsedMonths} leadMonths={leadMonths}
          />
        )}
      </main>

      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

// ---------------- Header ----------------
function Header({ goal, totalToday, goalDate }) {
  const remain = Math.max(0, goal.targetAmount - totalToday);
  const pct = Math.min(100, (totalToday / goal.targetAmount) * 100);
  return (
    <div
      className="px-4 pb-3"
      style={{
        borderBottom: `1px solid ${COLORS.panelBorder}`,
        // Header padding-top only needs to clear the safe-area notch/Dynamic
        // Island, not reproduce its full height as blank space above the
        // title. `env(safe-area-inset-top)` on iPhones with a notch/Dynamic
        // Island is typically 44–59px — subtracting only 4px left roughly a
        // line and a half of dead space above "存股資產追蹤". Subtracting
        // more claws that back, while `max(4px, ...)` keeps a small minimum
        // gap on devices with zero safe-area inset (Android, older iPhones)
        // so the title never touches the very top edge.
        paddingTop: "max(4px, calc(env(safe-area-inset-top, 0px) - 20px))",
      }}
    >
      <div className="max-w-2xl mx-auto">
        <div className="flex items-baseline justify-between">
          <h1 className="text-lg font-black tracking-tight" style={{ color: COLORS.gold }}>
            存股資產追蹤 <span className="text-[10px] font-medium" style={{ color: COLORS.sub }}>v{APP_VERSION}</span>
          </h1>
          <span className="text-xs mono" style={{ color: COLORS.sub }}>
            目標 {goal.targetYear} · {nf(goal.targetAmount)}
          </span>
        </div>
        <div className="mt-2 h-1.5 rounded-full overflow-hidden" style={{ background: COLORS.panel }}>
          <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: COLORS.gold }} />
        </div>
        <div className="mt-1 flex items-baseline justify-between text-[11px] mono" style={{ color: COLORS.sub }}>
          <span>距目標 NT${nf(remain)}（已達成 {pct.toFixed(1)}%）</span>
          {goalDate && <span style={{ color: COLORS.gold }}>預計 {goalDate} 達成</span>}
        </div>
      </div>
    </div>
  );
}

// ---------------- Live Price Panel (dashboard) ----------------
function LivePricePanel({ holdings, onFillDailyTw }) {
  const [live, setLive] = useState({});      // symbol -> { price, prevClose, isUS, asOfDate, isStale }
  const [liveStatus, setLiveStatus] = useState("idle"); // idle | loading | done | error
  const [liveAt, setLiveAt] = useState(null);
  const [failedSymbols, setFailedSymbols] = useState([]);
  const [cacheLoaded, setCacheLoaded] = useState(false);
  const liveRef = useRef({});
  const isFetchingRef = useRef(false);
  const lastFetchAtRef = useRef(0);

  useEffect(() => {
    liveRef.current = live;
  }, [live]);

  // Dynamic watchlist: fetch every Taiwan holding whose current share count
  // is greater than zero. Add/sell holdings in the app and this list follows
  // automatically — no symbol needs to be hardcoded here.
  const activeHoldings = holdings.filter((h) => Number(h.current || 0) > 0 && h.symbol);
  // Auto-refresh reads this ref instead of closing over `activeHoldings`
  // directly, so an interval set up before you add/remove a holding still
  // fetches the current list instead of the one from when it was created.
  const activeRef = useRef(activeHoldings);
  useEffect(() => {
    activeRef.current = activeHoldings;
  });
  // A stable key so the auto-refresh effect only resets its interval when
  // the set of symbols actually changes, not on every render.
  const activeSymbolsKey = activeHoldings.map((h) => h.symbol).sort().join(",");

  // On first mount, load whatever was fetched last time from storage so
  // switching tabs or reopening the app shows the last known prices right
  // away instead of an empty panel that has to fetch from scratch again.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const cached = await loadKey("livePrices", null);
      if (cancelled || !cached) { setCacheLoaded(true); return; }
      const revived = {};
      Object.entries(cached.map || {}).forEach(([sym, v]) => {
        revived[sym] = { ...v, asOfDate: v.asOfDate ? new Date(v.asOfDate) : null };
      });
      liveRef.current = revived;
      setLive(revived);
      setFailedSymbols(cached.failedSymbols || []);
      const cachedAt = cached.at ? new Date(cached.at) : null;
      setLiveAt(cachedAt);
      if (cachedAt) lastFetchAtRef.current = cachedAt.getTime();
      setLiveStatus(Object.keys(revived).length ? "done" : "idle");
      setCacheLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  const fetchAllLive = async () => {
    const targets = activeRef.current;
    if (!targets.length) return;
    // Guard against overlap: if a previous run (manual or auto) is still
    // in-flight, skip this tick instead of firing a duplicate API request.
    if (isFetchingRef.current) return;
    isFetchingRef.current = true;
    setLiveStatus("loading");
    const symbols = targets.map((h) => h.symbol);
    let quotes = null;
    try {
      try {
        quotes = await fetchQuotesWithFallback(symbols);
      } catch (e) {
        // One retry after a short pause — a brief TWSE/API hiccup
        // shouldn't fail the whole refresh.
        await new Promise((res) => setTimeout(res, 800));
        quotes = await fetchQuotesWithFallback(symbols);
      }
    } catch (e) {
      quotes = null;
    }
    const failed = symbols.filter((s) => !quotes || !quotes[s]);
    const now = new Date();
    // Merge this refresh with the last known successful price for any
    // symbol that failed this round. This keeps the dashboard useful during
    // temporary proxy/API hiccups instead of making that holding disappear.
    const mergedMap = {};
    targets.forEach((h) => {
      if (quotes && quotes[h.symbol]) {
        // Stamp with "now" only for a genuinely fresh fetch this round.
        mergedMap[h.symbol] = { ...quotes[h.symbol], fetchedAt: now.toISOString() };
      } else if (liveRef.current[h.symbol]) {
        // Carry over the old entry as-is, fetchedAt included — so the UI
        // can tell "this is what we showed last time" from "this just came in".
        mergedMap[h.symbol] = liveRef.current[h.symbol];
      }
    });
    liveRef.current = mergedMap;
    setLive(mergedMap);
    setFailedSymbols(failed);
    setLiveStatus(Object.keys(mergedMap).length ? "done" : "error");
    setLiveAt(now);
    lastFetchAtRef.current = now.getTime();
    // Persist the merged map so failed symbols also survive an app reopen.
    if (Object.keys(mergedMap).length) {
      saveKey("livePrices", { map: mergedMap, failedSymbols: failed, at: now.toISOString() });
    }
    isFetchingRef.current = false;
  };

  // Auto-refresh when the panel is ready, then every 15 seconds — but only
  // during TWSE trading hours. Outside those hours the price wouldn't be
  // changing anyway, so this avoids hitting the price source for nothing
  // all evening/overnight/weekends — it falls back to fully manual then.
  // The manual "抓取即時股價" button is unaffected by this — you can still
  // press it any time to check the last close. If we just loaded a cache
  // that's still fresh (e.g. you switched tabs and back within a few
  // seconds), skip the immediate refetch and just let the interval pick up
  // from there. The effect keys off activeSymbolsKey (not the array itself)
  // so it resets the interval when holdings actually change, not on every
  // render.
  useEffect(() => {
    if (!cacheLoaded || !activeSymbolsKey) return;
    const isFresh = Date.now() - lastFetchAtRef.current < 12000;
    if (!isFresh && isTwseTradingHours()) fetchAllLive();
    const timer = setInterval(() => {
      if (isTwseTradingHours()) fetchAllLive();
    }, 15000);
    return () => clearInterval(timer);
  }, [cacheLoaded, activeSymbolsKey]);

  const rows = activeHoldings.map((h) => {
    const l = live[h.symbol];
    if (!l) return null;
    const chg = l.price - l.prevClose;
    const chgPct = l.prevClose ? (chg / l.prevClose) * 100 : 0;
    const value = l.price * h.current;
    const isFromCache = failedSymbols.includes(h.symbol);
    const quoteIsStale = Boolean(l.isStale);
    return { ...h, price: l.price, chg, chgPct, value, isUS: l.isUS, fetchedAt: l.fetchedAt, isFromCache, quoteIsStale };
  }).filter(Boolean);

  const totalValue = rows.reduce((s, r) => s + r.value, 0);
  const hasLive = rows.length > 0;
  const staleOne = Object.values(live).find((l) => l.isStale && l.asOfDate);

  const recordToday = () => {
    if (!onFillDailyTw) return;
    onFillDailyTw(Math.round(totalValue));
  };

  return (
    <Panel title="即時股價">
      <div className="flex items-center justify-between gap-2 mb-2">
        <div className="text-[11px]" style={{ color: COLORS.sub }}>
          {liveStatus === "idle" && `自動抓取目前持有的 ${activeHoldings.length} 檔台股（開盤時間每 15 秒更新，收盤後改手動）`}
          {liveStatus === "loading" && "更新中…"}
          {liveStatus === "done" && liveAt && (staleOne
            ? `休市中，顯示 ${staleOne.asOfDate.getFullYear()}/${String(staleOne.asOfDate.getMonth()+1).padStart(2,"0")}/${String(staleOne.asOfDate.getDate()).padStart(2,"0")} 收盤價（查詢 ${liveAt.toLocaleTimeString("zh-TW", { hour12: false })}）`
            : `已更新 ${liveAt.toLocaleTimeString("zh-TW", { hour12: false })}`)}
          {liveStatus === "error" && "抓取失敗（來源可能暫時壅塞），稍後再試或改用券商 App 查詢"}
        </div>
        <button
          onClick={fetchAllLive}
          disabled={liveStatus === "loading" || !activeHoldings.length}
          className="text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 flex-shrink-0"
          style={{ background: COLORS.gold, color: COLORS.bg, opacity: (liveStatus === "loading" || !activeHoldings.length) ? 0.5 : 1 }}
        >
          {liveStatus === "loading" ? <Loader2 size={13} className="animate-spin" /> : null}
          抓取即時股價
        </button>
      </div>

      {hasLive && (
        <div>
          <div className="grid grid-cols-4 gap-1 text-[10px] pb-1.5 mb-1.5" style={{ color: COLORS.sub, borderBottom: `1px solid ${COLORS.panelBorder}` }}>
            <span>代號</span>
            <span className="text-right">股價</span>
            <span className="text-right">漲跌幅</span>
            <span className="text-right">市值</span>
          </div>
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {rows.map((r) => (
              <div key={r.id}>
                <div className="grid grid-cols-4 gap-1 text-xs mono items-center">
                  <span style={{ color: COLORS.sub }}>{r.symbol}</span>
                  <span className="text-right">{r.price.toFixed(2)}</span>
                  <span className="text-right" style={{ color: r.quoteIsStale ? COLORS.sub : (r.chg >= 0 ? COLORS.gain : COLORS.loss) }}>
                    {r.quoteIsStale && isTwseTradingHours()
                      ? "待更新"
                      : <>{r.chg >= 0 ? "▲" : "▼"} {r.chgPct >= 0 ? "+" : ""}{r.chgPct.toFixed(2)}%</>}
                  </span>
                  <span className="text-right font-bold">{nf(r.value)}</span>
                </div>
                {r.isFromCache && r.fetchedAt && (
                  <div className="text-[9px] text-right mt-0.5" style={{ color: COLORS.sub }}>
                    這次抓取失敗，顯示上次成功價格（{new Date(r.fetchedAt).toLocaleString("zh-TW", {
                      month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false,
                    })}）
                  </div>
                )}
              </div>
            ))}
          </div>
          <div className="flex justify-between text-xs mono pt-2 mt-2 font-bold" style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
            <span style={{ color: COLORS.sub }}>全部股票總市值</span>
            <span style={{ color: COLORS.gold }}>NT$ {nf(totalValue)}</span>
          </div>
          {onFillDailyTw && (
            <>
              <button onClick={recordToday}
                className="mt-2 w-full rounded-lg py-2 text-[11px] font-bold"
                style={{ background: COLORS.bg, border: `1px solid ${COLORS.gold}`, color: COLORS.gold }}>
                帶入「每日紀錄」台股市值
              </button>
              <div className="text-[10px] mt-1" style={{ color: COLORS.sub }}>
                會跳到「每日紀錄」並自動填好台股市值，美股記得手動補上再儲存
              </div>
            </>
          )}
        </div>
      )}
      {liveStatus === "done" && failedSymbols.length > 0 && (
        <div className="text-[11px] mt-2" style={{ color: COLORS.loss }}>
          抓取失敗：{failedSymbols.join("、")}（來源暫時壅塞，可再按一次重試）
        </div>
      )}
      {!activeHoldings.length && <Empty text="請先到「持股進度」新增持股並填入股數，才能抓取即時股價" />}
    </Panel>
  );
}

// ---------------- Dashboard ----------------
// Range options for the asset-curve chart. "days: null" means show
// everything. Kept outside the component so the array identity is stable
// across renders (used as a dependency below).
const CHART_RANGES = [
  { id: "1m", label: "1個月", days: 30 },
  { id: "3m", label: "3個月", days: 90 },
  { id: "6m", label: "半年", days: 182 },
  { id: "1y", label: "1年", days: 365 },
  { id: "all", label: "全部", days: null },
];

function Dashboard({ totalToday, dailyChange, dailyChangePct, capitalGain, totalDividends,
  totalReturn, totalReturnPct, highPoint, drawdown, ytdGain, ytdPct, chartData, goal, totalInvested, holdings,
  onFillDailyTw }) {
  const up = dailyChange >= 0;
  // Defaults to "1年" rather than "全部": with 3+ sparse years plotted
  // proportionally to real time (see pickEvenTimeTicks above), the last
  // few months of daily-tracked detail — the part most people check day to
  // day — get compressed into a thin sliver on the full-history view. A
  // shorter default window shows that recent detail first; "全部" is one
  // tap away for anyone who wants the long-term shape.
  const [chartRangeId, setChartRangeId] = useState("1y");
  const rangedChartData = useMemo(() => {
    const range = CHART_RANGES.find((r) => r.id === chartRangeId) || CHART_RANGES[CHART_RANGES.length - 1];
    if (!range.days || chartData.length === 0) return chartData;
    const cutoff = chartData[chartData.length - 1].t - range.days * 24 * 60 * 60 * 1000;
    const filtered = chartData.filter((d) => d.t >= cutoff);
    // If the chosen window is shorter than the data actually goes back
    // (e.g. "1個月" on a brand-new tracker), fall back to everything rather
    // than showing a near-empty chart.
    return filtered.length > 1 ? filtered : chartData;
  }, [chartData, chartRangeId]);
  return (
    <div className="space-y-4">
      <div className="rounded-2xl p-4" style={{
        background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`,
        boxShadow: "0 4px 16px rgba(0,0,0,0.28)",
      }}>
        <div className="text-xs" style={{ color: COLORS.sub }}>目前總資產</div>
        <div className="text-3xl font-black mono mt-1"><AnimatedNumber value={totalToday} prefix="NT$ " /></div>
        <div className="flex items-center gap-1 mt-1.5 text-sm mono"
          style={{ color: up ? COLORS.gain : COLORS.loss }}>
          {up ? <TrendingUp size={16} /> : <TrendingDown size={16} />}
          {nf(dailyChange)}（{pf(dailyChangePct)}）今日
        </div>
      </div>

      <LivePricePanel holdings={holdings} onFillDailyTw={onFillDailyTw} />

      {chartData.length > 1 && (
        <div className="rounded-2xl p-4" style={{
          background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`,
          boxShadow: "0 4px 16px rgba(0,0,0,0.28)",
        }}>
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs" style={{ color: COLORS.sub }}>資產曲線</div>
            <div className="flex gap-1">
              {CHART_RANGES.map((r) => {
                const active = chartRangeId === r.id;
                return (
                  <button key={r.id} onClick={() => setChartRangeId(r.id)}
                    className="rounded-lg px-1.5 py-1 text-[10px] font-bold whitespace-nowrap"
                    style={{
                      background: active ? COLORS.gold : COLORS.bg,
                      color: active ? "#0A0F1C" : COLORS.sub,
                      border: `1px solid ${active ? COLORS.gold : COLORS.panelBorder}`,
                    }}>
                    {r.label}
                  </button>
                );
              })}
            </div>
          </div>
          <div style={{ height: 180 }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={rangedChartData} margin={{ top: 4, right: 4, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                <XAxis dataKey="t" type="number" domain={["dataMin", "dataMax"]}
                  tick={{ fontSize: 9, fill: COLORS.sub }}
                  ticks={pickEvenTimeTicks(rangedChartData, "t", 6)} tickFormatter={formatTickDate} />
                <YAxis tick={{ fontSize: 9, fill: COLORS.sub }}
                  tickFormatter={(v) => `${(v / 10000).toFixed(0)}萬`} width={44} />
                <Tooltip
                  labelFormatter={formatTickDate}
                  contentStyle={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}`, fontSize: 12 }}
                  formatter={(v) => [`NT$ ${nf(v)}`, "總資產"]} />
                <ReferenceLine y={goal.targetAmount} stroke={COLORS.gold} strokeDasharray="4 4" />
                <Line type="monotone" dataKey="total" stroke={COLORS.gold} strokeWidth={2} dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-3">
        <StatCard label="持倉損益(估)" value={`NT$ ${nf(capitalGain)}`} tone={capitalGain >= 0 ? "gain" : "loss"} />
        <StatCard label="累積股息" value={`NT$ ${nf(totalDividends)}`} tone="gold" />
        <StatCard label="粗估總報酬" value={`NT$ ${nf(totalReturn)}`} tone={totalReturn >= 0 ? "gain" : "loss"} />
        <StatCard label="粗估報酬率" value={pf(totalReturnPct)} tone={totalReturnPct >= 0 ? "gain" : "loss"} />
        <StatCard label="今年以來(YTD)" value={`${nf(ytdGain)}（${pf(ytdPct)}）`} tone={ytdGain >= 0 ? "gain" : "loss"} className="col-span-2" />
      </div>
      <div className="text-[11px] px-1" style={{ color: COLORS.sub }}>
        註：目前成本來自券商/每日紀錄的持倉成本；若曾賣出、換股或用股息再投入，
        「粗估總報酬」不等同完整 XIRR 或全期間真實總報酬。
      </div>

      <div className="rounded-2xl p-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
        <div className="text-xs mb-2" style={{ color: COLORS.sub }}>資產高點</div>
        <div className="flex justify-between text-sm mono">
          <span style={{ color: COLORS.sub }}>{highPoint.date || "—"}</span>
          <span>NT$ {nf(highPoint.value === -Infinity ? 0 : highPoint.value)}</span>
        </div>
        <div className="flex justify-between text-sm mono mt-1">
          <span style={{ color: COLORS.sub }}>回撤率</span>
          <span style={{ color: drawdown < 0 ? COLORS.loss : COLORS.text }}>{pf(drawdown)}</span>
        </div>
        <div className="flex justify-between text-sm mono mt-1">
          <span style={{ color: COLORS.sub }}>目前持倉成本</span>
          <span>NT$ {nf(totalInvested)}</span>
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, tone, className = "" }) {
  const color = tone === "gain" ? COLORS.gain : tone === "loss" ? COLORS.loss : tone === "gold" ? COLORS.gold : COLORS.text;
  return (
    <div className={`rounded-2xl p-4 ${className}`} style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
      <div className="text-xs" style={{ color: COLORS.sub }}>{label}</div>
      <div className="text-lg font-bold mono mt-1" style={{ color }}>{value}</div>
    </div>
  );
}

// ---------------- Daily Panel ----------------
function DailyPanel({ records, setRecords, prefill, form, setForm }) {
  // When "帶入「每日紀錄」..." is pressed elsewhere in the app, prefill is
  // set to a fresh object each time — that reference change is what makes
  // this effect fire again even if the same value is sent twice. Only the
  // fields actually present on prefill get overwritten, so the market-value
  // button and the cost-basis button can each fill in just their own field.
  useEffect(() => {
    if (!prefill) return;
    setForm((f) => {
      const next = { ...f, date: todayStr() };
      if (prefill.twValue != null) next.twValue = String(prefill.twValue);
      if (prefill.twCost != null) next.twCost = String(prefill.twCost);
      return next;
    });
  }, [prefill]);
  const add = () => {
    if (!form.twValue && !form.usValue) return;
    setRecords((r) => {
      const filtered = r.filter((x) => x.date !== form.date);
      return [...filtered, {
        id: uid(), date: form.date,
        twValue: Number(form.twValue || 0), usValue: Number(form.usValue || 0),
        twCost: Number(form.twCost || 0), usCost: Number(form.usCost || 0),
      }];
    });
    setForm({ date: todayStr(), twValue: "", usValue: "", twCost: "", usCost: "" });
  };
  const remove = (id) => setRecords((r) => r.filter((x) => x.id !== id));
  const reversed = [...records].reverse();

  // Monthly summary: for each month, compare the last record of that month
  // against the last record before it (i.e. the prior month's closing
  // value) to get that month's gain/loss and return %. The very first
  // month in the whole history has no "before" record to compare against,
  // so it's left blank rather than showing a misleading 0%/100%.
  const monthlyStats = {};
  const monthKey = (d) => d.slice(0, 7); // "YYYY-MM"
  let lastSeenPerMonth = {};
  records.forEach((r) => { lastSeenPerMonth[monthKey(r.date)] = r; });
  const monthKeys = Object.keys(lastSeenPerMonth).sort();
  monthKeys.forEach((mk, i) => {
    const endRec = lastSeenPerMonth[mk];
    const endValue = endRec.twValue + endRec.usValue;
    const endCost = (endRec.twCost || 0) + (endRec.usCost || 0);
    const prevMk = i > 0 ? monthKeys[i - 1] : null;
    if (!prevMk) { monthlyStats[mk] = null; return; }
    const startRec = lastSeenPerMonth[prevMk];
    const startValue = startRec.twValue + startRec.usValue;
    const startCost = (startRec.twCost || 0) + (startRec.usCost || 0);
    // Market return isolates actual investment performance from money you
    // added that month: compare unrealized gain (value − cost) at the
    // start vs end of the month, instead of comparing raw asset value
    // (which would count new contributions as if they were investment
    // gains). Contribution is the month's own number: how much your cost
    // basis grew, i.e. how much new money went in.
    // This only works if BOTH ends of the month have real cost data. If
    // cost tracking started partway through your history, one side will
    // read as 0 (not "genuinely zero cost", just "not filled in yet") —
    // using it anyway would misread that as a huge fake gain/loss for
    // whichever month straddles that transition. Fall back to the plain
    // value-based estimate for exactly that month instead.
    const hasCostBothEnds = startCost > 0 && endCost > 0;
    let marketReturn, pct, contribution;
    if (hasCostBothEnds) {
      marketReturn = (endValue - endCost) - (startValue - startCost);
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = endCost - startCost;
    } else {
      marketReturn = endValue - startValue;
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = null; // unknown split between market move and new money
    }
    monthlyStats[mk] = { marketReturn, pct, contribution, approximate: !hasCostBothEnds };
  });

  // Yearly summary: same market-return / contribution split as monthly
  // above, just grouped by year instead of month. Reuses the exact same
  // logic (and the same "no cost data on one side" fallback) so the
  // numbers here are directly comparable to the monthly breakdown.
  const yearlyStats = {};
  const yearKey = (d) => d.slice(0, 4); // "YYYY"
  let lastSeenPerYear = {};
  records.forEach((r) => { lastSeenPerYear[yearKey(r.date)] = r; });
  const yearKeys = Object.keys(lastSeenPerYear).sort();
  yearKeys.forEach((yk, i) => {
    const endRec = lastSeenPerYear[yk];
    const endValue = endRec.twValue + endRec.usValue;
    const endCost = (endRec.twCost || 0) + (endRec.usCost || 0);
    const prevYk = i > 0 ? yearKeys[i - 1] : null;
    if (!prevYk) { yearlyStats[yk] = null; return; }
    const startRec = lastSeenPerYear[prevYk];
    const startValue = startRec.twValue + startRec.usValue;
    const startCost = (startRec.twCost || 0) + (startRec.usCost || 0);
    const hasCostBothEnds = startCost > 0 && endCost > 0;
    let marketReturn, pct, contribution;
    if (hasCostBothEnds) {
      marketReturn = (endValue - endCost) - (startValue - startCost);
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = endCost - startCost;
    } else {
      marketReturn = endValue - startValue;
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = null;
    }
    yearlyStats[yk] = { marketReturn, pct, contribution, approximate: !hasCostBothEnds };
  });

  // Weekly summary: same market-return / contribution split as monthly and
  // yearly above, just grouped by ISO week (Monday-start) instead. Shown as
  // a horizontally swipeable strip of compact cards rather than a vertical
  // list — a full year of weekly data would make an very long list, and
  // weekly numbers are usually small day-to-day noise that's more useful to
  // skim sideways a few at a time than to scroll through in bulk.
  const mondayOf = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  };
  const weeklyStats = {};
  const weekKey = (d) => mondayOf(d);
  let lastSeenPerWeek = {};
  records.forEach((r) => { lastSeenPerWeek[weekKey(r.date)] = r; });
  const weekKeys = Object.keys(lastSeenPerWeek).sort();
  weekKeys.forEach((wk, i) => {
    const endRec = lastSeenPerWeek[wk];
    const endValue = endRec.twValue + endRec.usValue;
    const endCost = (endRec.twCost || 0) + (endRec.usCost || 0);
    const prevWk = i > 0 ? weekKeys[i - 1] : null;
    if (!prevWk) { weeklyStats[wk] = null; return; }
    const startRec = lastSeenPerWeek[prevWk];
    const startValue = startRec.twValue + startRec.usValue;
    const startCost = (startRec.twCost || 0) + (startRec.usCost || 0);
    const hasCostBothEnds = startCost > 0 && endCost > 0;
    let marketReturn, pct, contribution;
    if (hasCostBothEnds) {
      marketReturn = (endValue - endCost) - (startValue - startCost);
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = endCost - startCost;
    } else {
      marketReturn = endValue - startValue;
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = null;
    }
    weeklyStats[wk] = { marketReturn, pct, contribution, approximate: !hasCostBothEnds };
  });
  const weekLabel = (wk) => {
    const start = new Date(wk + "T00:00:00");
    const end = new Date(start); end.setDate(end.getDate() + 6);
    const fmt = (d) => `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    return `${fmt(start)}-${fmt(end)}`;
  };

  return (
    <div className="space-y-4">
      <Panel title="新增每日紀錄">
        <div className="grid grid-cols-2 gap-2">
          <Field label="日期"><input type="date" value={form.date}
            onChange={(e) => setForm({ ...form, date: e.target.value })}
            className="input" /></Field>
          <div />
          <Field label="台股市值"><input type="number" value={form.twValue}
            onChange={(e) => setForm({ ...form, twValue: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="美股市值"><input type="number" value={form.usValue}
            onChange={(e) => setForm({ ...form, usValue: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="台股成本"><input type="number" value={form.twCost}
            onChange={(e) => setForm({ ...form, twCost: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="美股成本"><input type="number" value={form.usCost}
            onChange={(e) => setForm({ ...form, usCost: e.target.value })}
            placeholder="0" className="input" /></Field>
        </div>
        <AddButton onClick={add} label="儲存紀錄" />
      </Panel>

      {weekKeys.length > 0 && (
        <Panel title="週度損益">
          {weekKeys.some((wk) => weeklyStats[wk]?.approximate) && (
            <div className="text-[10px] mb-2" style={{ color: COLORS.sub }}>
              * 成本資料不完整的週份，市場報酬與新增投入無法精準拆分，數字為粗估
            </div>
          )}
          <div className="text-[10px] mb-1.5" style={{ color: COLORS.sub }}>左右滑動看更早的週</div>
          <div className="flex gap-2 overflow-x-auto snap-x snap-mandatory pb-1"
            style={{ scrollbarWidth: "none" }}>
            {[...weekKeys].reverse().map((wk) => {
              const stat = weeklyStats[wk];
              const up = stat && stat.marketReturn >= 0;
              return (
                <div key={wk} className="flex-none snap-start rounded-lg px-2 py-2 text-center mono"
                  style={{ width: "29%", background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div className="text-[9px] mb-1 whitespace-nowrap" style={{ color: COLORS.sub }}>
                    {weekLabel(wk)}{stat?.approximate ? " *" : ""}
                  </div>
                  {stat ? (
                    <>
                      <div className="text-xs font-bold" style={{ color: up ? COLORS.gain : COLORS.loss }}>
                        {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}
                      </div>
                      <div className="text-[10px]" style={{ color: up ? COLORS.gain : COLORS.loss }}>
                        {stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%
                      </div>
                      {stat.contribution != null && stat.contribution !== 0 && (
                        <div className="text-[9px] mt-0.5" style={{ color: COLORS.gold }}>
                          +{nf(stat.contribution)}
                        </div>
                      )}
                    </>
                  ) : (
                    <div className="text-[9px]" style={{ color: COLORS.sub }}>無前週可比較</div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {monthKeys.length > 0 && (
        <Panel title="月度損益">
          {monthKeys.some((mk) => monthlyStats[mk]?.approximate) && (
            <div className="text-[10px] mb-2" style={{ color: COLORS.sub }}>
              * 成本資料不完整的月份，市場報酬與新增投入無法精準拆分，數字為粗估
            </div>
          )}
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {[...monthKeys].reverse().map((mk) => {
              const stat = monthlyStats[mk];
              return (
                <div key={mk} className="rounded-lg px-3 py-2 text-xs mono"
                  style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div className="flex justify-between items-baseline">
                    <span style={{ color: COLORS.sub }}>{mk}{stat?.approximate ? " *" : ""}</span>
                    {stat ? (
                      <span className="font-bold" style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                        市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                      </span>
                    ) : (
                      <span style={{ color: COLORS.sub }}>最早紀錄，無前月可比較</span>
                    )}
                  </div>
                  {stat && stat.contribution != null && stat.contribution !== 0 && (
                    <div className="text-right mt-0.5" style={{ color: COLORS.gold }}>
                      新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {yearKeys.length > 0 && (
        <Panel title="年度損益">
          {yearKeys.some((yk) => yearlyStats[yk]?.approximate) && (
            <div className="text-[10px] mb-2" style={{ color: COLORS.sub }}>
              * 成本資料不完整的年份，市場報酬與新增投入無法精準拆分，數字為粗估
            </div>
          )}
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {[...yearKeys].reverse().map((yk) => {
              const stat = yearlyStats[yk];
              return (
                <div key={yk} className="rounded-lg px-3 py-2 text-xs mono"
                  style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div className="flex justify-between items-baseline">
                    <span style={{ color: COLORS.sub }}>{yk}{stat?.approximate ? " *" : ""}</span>
                    {stat ? (
                      <span className="font-bold" style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                        市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                      </span>
                    ) : (
                      <span style={{ color: COLORS.sub }}>最早紀錄，無前年可比較</span>
                    )}
                  </div>
                  {stat && stat.contribution != null && stat.contribution !== 0 && (
                    <div className="text-right mt-0.5" style={{ color: COLORS.gold }}>
                      新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}


      <Panel title={`歷史紀錄（${records.length}）`}>
        <div className="space-y-2 max-h-[30rem] overflow-y-auto">
          {(() => {
            let lastMonth = null;
            return reversed.map((r, i) => {
              const total = r.twValue + r.usValue;
              const totalCost = (r.twCost || 0) + (r.usCost || 0);
              const prevRec = records[records.length - 2 - i];
              const diff = prevRec ? total - (prevRec.twValue + prevRec.usValue) : null;
              const mk = monthKey(r.date);
              const showHeader = mk !== lastMonth;
              lastMonth = mk;
              const stat = monthlyStats[mk];
              return (
                <div key={r.id}>
                  {showHeader && (
                    <div className="pt-3 pb-1.5 text-[11px] font-bold mono"
                      style={{ borderTop: i > 0 ? `1px solid ${COLORS.panelBorder}` : "none", marginTop: i > 0 ? "0.25rem" : 0 }}>
                      <div className="flex justify-between items-baseline">
                        <span style={{ color: COLORS.gold }}>{mk}{stat?.approximate ? " *" : ""}</span>
                        {stat ? (
                          <span style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                            市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                          </span>
                        ) : (
                          <span style={{ color: COLORS.sub, fontWeight: "normal" }}>最早紀錄，無前月可比較</span>
                        )}
                      </div>
                      {stat && stat.contribution != null && stat.contribution !== 0 && (
                        <div className="text-right font-normal" style={{ color: COLORS.gold }}>
                          新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                        </div>
                      )}
                    </div>
                  )}
                  <Row onDelete={() => remove(r.id)}>
                    <div className="flex-1">
                      <div className="text-sm mono">{r.date}</div>
                      <div className="text-[11px]" style={{ color: COLORS.sub }}>
                        台 {nf(r.twValue)} ／ 美 {nf(r.usValue)}
                      </div>
                      {totalCost > 0 && (
                        <div className="text-[11px] mono" style={{ color: COLORS.sub }}>
                          成本 台 {nf(r.twCost)} ／ 美 {nf(r.usCost)}
                        </div>
                      )}
                    </div>
                    <div className="text-right">
                      <div className="mono text-sm font-bold">{nf(total)}</div>
                      {diff != null && (
                        <div className="text-[11px] mono" style={{ color: diff >= 0 ? COLORS.gain : COLORS.loss }}>
                          {diff >= 0 ? "+" : ""}{nf(diff)}
                        </div>
                      )}
                      {totalCost > 0 && (
                        <div className="text-[11px] mono" style={{ color: (total - totalCost) >= 0 ? COLORS.gain : COLORS.loss }}>
                          損益 {(total - totalCost) >= 0 ? "+" : ""}{nf(total - totalCost)}
                        </div>
                      )}
                    </div>
                  </Row>
                </div>
              );
            });
          })()}
          {records.length === 0 && <Empty text="尚無紀錄，新增第一筆吧" />}
        </div>
      </Panel>
    </div>
  );
}

// ---------------- Holdings Panel ----------------
function HoldingsPanel({ holdings, setHoldings }) {
  const [form, setForm] = useState({ symbol: "", name: "", initialShares: "", target2035: "" });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  const add = () => {
    if (!form.symbol) return;
    setHoldings((h) => [...h, {
      id: uid(), symbol: form.symbol, name: form.name,
      initialShares: Number(form.initialShares || 0), target2035: Number(form.target2035 || 0),
    }]);
    setForm({ symbol: "", name: "", initialShares: "", target2035: "" });
  };
  const remove = (id) => setHoldings((h) => h.filter((x) => x.id !== id));

  const startEdit = (h) => {
    setEditingId(h.id);
    setEditForm({ symbol: h.symbol, name: h.name, initialShares: String(h.initialShares), target2035: String(h.target2035) });
  };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); };
  const saveEdit = () => {
    setHoldings((hs) => hs.map((h) => h.id === editingId ? {
      ...h, symbol: editForm.symbol, name: editForm.name,
      initialShares: Number(editForm.initialShares || 0), target2035: Number(editForm.target2035 || 0),
    } : h));
    cancelEdit();
  };

  return (
    <div className="space-y-4">
      <Panel title="持股進度">
        <div className="space-y-3">
          {holdings.map((h) => (
            <div key={h.id} className="rounded-xl p-3" style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
              {editingId === h.id ? (
                <div className="space-y-2">
                  <div className="grid grid-cols-2 gap-2">
                    <Field label="代號"><input value={editForm.symbol}
                      onChange={(e) => setEditForm({ ...editForm, symbol: e.target.value })} className="input" /></Field>
                    <Field label="名稱"><input value={editForm.name}
                      onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="input" /></Field>
                    <Field label="期初股數"><input type="number" value={editForm.initialShares}
                      onChange={(e) => setEditForm({ ...editForm, initialShares: e.target.value })} className="input" /></Field>
                    <Field label="目標股數"><input type="number" value={editForm.target2035}
                      onChange={(e) => setEditForm({ ...editForm, target2035: e.target.value })} className="input" /></Field>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={cancelEdit} className="rounded-lg py-2 text-xs font-bold"
                      style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, color: COLORS.sub }}>
                      取消
                    </button>
                    <button onClick={saveEdit} className="rounded-lg py-2 text-xs font-bold"
                      style={{ background: COLORS.gold, color: COLORS.bg }}>
                      儲存
                    </button>
                  </div>
                </div>
              ) : (
                <>
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="font-bold mono">{h.symbol}</div>
                      <div className="text-[11px]" style={{ color: COLORS.sub }}>{h.name}</div>
                    </div>
                    <div className="flex items-center gap-3">
                      <button onClick={() => startEdit(h)} style={{ color: COLORS.sub }}><PencilIcon size={15} /></button>
                      <button onClick={() => remove(h.id)} style={{ color: COLORS.sub }}><TrashIcon size={15} /></button>
                    </div>
                  </div>
                  <div className="flex justify-between text-xs mono mt-2">
                    <span style={{ color: COLORS.sub }}>目前 {nf(h.current)} 股</span>
                    <span style={{ color: COLORS.sub }}>目標 {nf(h.target2035)} 股</span>
                  </div>
                  <div className="mt-1 h-1.5 rounded-full overflow-hidden" style={{ background: COLORS.panelBorder }}>
                    <div className="h-full rounded-full" style={{ width: `${h.pct}%`, background: COLORS.gold }} />
                  </div>
                  <div className="text-right text-[11px] mono mt-1" style={{ color: COLORS.gold }}>
                    達成率 {h.pct.toFixed(1)}%
                  </div>
                </>
              )}
            </div>
          ))}
          {holdings.length === 0 && <Empty text="尚未新增持股標的" />}
        </div>
      </Panel>

      <Panel title="新增持股標的">
        <div className="grid grid-cols-2 gap-2">
          <Field label="代號"><input value={form.symbol}
            onChange={(e) => setForm({ ...form, symbol: e.target.value })}
            placeholder="0056" className="input" /></Field>
          <Field label="名稱"><input value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            placeholder="高股息ETF" className="input" /></Field>
          <Field label="期初股數"><input type="number" value={form.initialShares}
            onChange={(e) => setForm({ ...form, initialShares: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="2035目標股數"><input type="number" value={form.target2035}
            onChange={(e) => setForm({ ...form, target2035: e.target.value })}
            placeholder="0" className="input" /></Field>
        </div>
        <AddButton onClick={add} label="新增標的" />
      </Panel>
    </div>
  );
}

// ---------------- Trades Panel ----------------
function TradesPanel({ trades, setTrades, holdings, costBasis, setCostBasis, accumulatedCost, onFillDailyCost }) {
  const [form, setForm] = useState({
    date: todayStr(), symbol: "", action: "buy", shares: "", price: "", fee: "", tax: "", note: "",
  });
  const add = () => {
    if (!form.symbol || !form.shares || !form.price) return;
    const shares = Number(form.shares), price = Number(form.price);
    const fee = Number(form.fee || 0), tax = Number(form.tax || 0);
    const amount = form.action === "buy" ? shares * price + fee : shares * price - fee - tax;
    setTrades((t) => [...t, {
      id: uid(), date: form.date, symbol: form.symbol, action: form.action,
      shares, price, fee, tax, amount, note: form.note,
    }]);
    setForm({ date: todayStr(), symbol: "", action: "buy", shares: "", price: "", fee: "", tax: "", note: "" });
  };
  const remove = (id) => setTrades((t) => t.filter((x) => x.id !== id));
  const sorted = [...trades].sort((a, b) => b.date.localeCompare(a.date));

  return (
    <div className="space-y-4">
      {costBasis && (
        <Panel title="成本追蹤">
          <Field label="起始成本（交易紀錄開始追蹤之前，已經投入的成本）">
            <input type="number" value={costBasis.startingCost}
              onChange={(e) => setCostBasis({ ...costBasis, startingCost: Number(e.target.value || 0) })}
              className="input" />
          </Field>
          <div className="flex justify-between items-baseline mt-3 text-sm mono">
            <span style={{ color: COLORS.sub }}>目前累積成本（起始成本 + 全部買賣紀錄）</span>
            <span className="font-bold" style={{ color: COLORS.gold }}>NT$ {nf(accumulatedCost)}</span>
          </div>
          {onFillDailyCost && (
            <>
              <button onClick={() => onFillDailyCost(Math.round(accumulatedCost))}
                className="mt-3 w-full rounded-lg py-2 text-[11px] font-bold"
                style={{ background: COLORS.bg, border: `1px solid ${COLORS.gold}`, color: COLORS.gold }}>
                帶入「每日紀錄」台股成本
              </button>
              <div className="text-[10px] mt-1" style={{ color: COLORS.sub }}>
                會跳到「每日紀錄」並自動填好今天的台股成本，確認後按「儲存紀錄」即可
              </div>
            </>
          )}
        </Panel>
      )}

      <Panel title="新增交易">
        <div className="grid grid-cols-2 gap-2">
          <Field label="日期"><input type="date" value={form.date}
            onChange={(e) => setForm({ ...form, date: e.target.value })} className="input" /></Field>
          <Field label="買賣">
            <select value={form.action} onChange={(e) => setForm({ ...form, action: e.target.value })} className="input">
              <option value="buy">買</option>
              <option value="sell">賣</option>
            </select>
          </Field>
          <Field label="代號">
            <input value={form.symbol} onChange={(e) => setForm({ ...form, symbol: e.target.value })}
              placeholder="0050" list="symbols" className="input" />
            <datalist id="symbols">{holdings.map((h) => <option key={h.id} value={h.symbol} />)}</datalist>
          </Field>
          <Field label="股數"><input type="number" value={form.shares}
            onChange={(e) => setForm({ ...form, shares: e.target.value })} className="input" /></Field>
          <Field label="成交價"><input type="number" value={form.price}
            onChange={(e) => setForm({ ...form, price: e.target.value })} className="input" /></Field>
          <Field label="手續費"><input type="number" value={form.fee}
            onChange={(e) => setForm({ ...form, fee: e.target.value })} placeholder="0" className="input" /></Field>
          <Field label="交易稅（賣出）"><input type="number" value={form.tax}
            onChange={(e) => setForm({ ...form, tax: e.target.value })} placeholder="0" className="input" /></Field>
          <Field label="備註"><input value={form.note}
            onChange={(e) => setForm({ ...form, note: e.target.value })} className="input" /></Field>
        </div>
        <AddButton onClick={add} label="新增交易" />
      </Panel>

      <Panel title={`交易紀錄（${trades.length}）`}>
        <div className="space-y-2 max-h-96 overflow-y-auto">
          {sorted.map((t) => (
            <Row key={t.id} onDelete={() => remove(t.id)}>
              <div className="flex-1">
                <div className="text-sm mono">
                  {t.date} <span style={{ color: t.action === "buy" ? COLORS.gain : COLORS.loss }}>
                    {t.action === "buy" ? "買" : "賣"}
                  </span> {t.symbol}
                </div>
                <div className="text-[11px]" style={{ color: COLORS.sub }}>
                  {nf(t.shares)}股 @ {t.price}
                </div>
              </div>
              <div className="text-right mono text-sm font-bold">
                {t.action === "sell" ? "+" : "-"}{nf(t.amount)}
              </div>
            </Row>
          ))}
          {trades.length === 0 && <Empty text="尚無交易紀錄" />}
        </div>
      </Panel>
    </div>
  );
}

// ---------------- Dividends Panel ----------------
function DividendsPanel({ dividends, setDividends, holdings }) {
  const [form, setForm] = useState({ date: todayStr(), symbol: "", shares: "", perShare: "" });
  // Typing/selecting a symbol that matches a holding auto-fills 股數 with
  // that holding's current share count, so you don't have to look it up
  // and retype it every time — still a normal editable field afterward if
  // the actual ex-dividend-date share count was different.
  const handleSymbolChange = (value) => {
    const match = holdings.find((h) => h.symbol === value);
    setForm((f) => ({
      ...f,
      symbol: value,
      shares: match ? String(match.current) : f.shares,
    }));
  };
  const add = () => {
    if (!form.symbol || !form.shares || !form.perShare) return;
    const amount = Number(form.shares) * Number(form.perShare);
    setDividends((d) => [...d, {
      id: uid(), date: form.date, symbol: form.symbol,
      shares: Number(form.shares), perShare: Number(form.perShare), amount,
    }]);
    setForm({ date: todayStr(), symbol: "", shares: "", perShare: "" });
  };
  const remove = (id) => setDividends((d) => d.filter((x) => x.id !== id));
  const sorted = [...dividends].sort((a, b) => b.date.localeCompare(a.date));
  const total = dividends.reduce((s, d) => s + d.amount, 0);

  return (
    <div className="space-y-4">
      <Panel title="新增配息">
        <div className="grid grid-cols-2 gap-2">
          <Field label="除息日"><input type="date" value={form.date}
            onChange={(e) => setForm({ ...form, date: e.target.value })} className="input" /></Field>
          <Field label="代號">
            <input value={form.symbol} onChange={(e) => handleSymbolChange(e.target.value)}
              placeholder="0056" list="symbols2" className="input" />
            <datalist id="symbols2">{holdings.map((h) => <option key={h.id} value={h.symbol} />)}</datalist>
          </Field>
          <Field label="股數（選了有持股的代號會自動帶入，可再手動調整）"><input type="number" value={form.shares}
            onChange={(e) => setForm({ ...form, shares: e.target.value })} className="input" /></Field>
          <Field label="每股配息"><input type="number" step="0.01" value={form.perShare}
            onChange={(e) => setForm({ ...form, perShare: e.target.value })} className="input" /></Field>
        </div>
        <AddButton onClick={add} label="新增配息紀錄" />
      </Panel>

      <Panel title={`累積股息：NT$ ${nf(total)}`}>
        <div className="space-y-2 max-h-96 overflow-y-auto">
          {sorted.map((d) => (
            <Row key={d.id} onDelete={() => remove(d.id)}>
              <div className="flex-1">
                <div className="text-sm mono">{d.date} · {d.symbol}</div>
                <div className="text-[11px]" style={{ color: COLORS.sub }}>
                  {nf(d.shares)}股 × {d.perShare}
                </div>
              </div>
              <div className="text-right mono text-sm font-bold" style={{ color: COLORS.gold }}>
                +{nf(d.amount)}
              </div>
            </Row>
          ))}
          {dividends.length === 0 && <Empty text="尚無配息紀錄" />}
        </div>
      </Panel>
    </div>
  );
}

// ---------------- Plan Panel ----------------
function PlanPanel({ planItems, setPlanItems, planTotal, goal, setGoal, exportBackup, importBackup, exportExcel }) {
  const [form, setForm] = useState({ symbol: "", amount: "", note: "" });
  const add = () => {
    if (!form.symbol || !form.amount) return;
    setPlanItems((p) => [...p, { id: uid(), symbol: form.symbol, amount: Number(form.amount), note: form.note }]);
    setForm({ symbol: "", amount: "", note: "" });
  };
  const remove = (id) => setPlanItems((p) => p.filter((x) => x.id !== id));

  return (
    <div className="space-y-4">
      <Panel title="退休目標設定">
        <div className="grid grid-cols-2 gap-2">
          <Field label="目標金額 (NTD)"><input type="number" value={goal.targetAmount}
            onChange={(e) => setGoal({ ...goal, targetAmount: Number(e.target.value) })} className="input" /></Field>
          <Field label="目標年份"><input type="number" value={goal.targetYear}
            onChange={(e) => setGoal({ ...goal, targetYear: Number(e.target.value) })} className="input" /></Field>
        </div>
      </Panel>

      <Panel title={`每月定期定額（合計 NT$ ${nf(planTotal)}）`}>
        <div className="space-y-2">
          {planItems.map((p) => (
            <Row key={p.id} onDelete={() => remove(p.id)}>
              <div className="flex-1">
                <div className="text-sm mono font-bold">{p.symbol}</div>
                {p.note && <div className="text-[11px]" style={{ color: COLORS.sub }}>{p.note}</div>}
              </div>
              <div className="mono text-sm font-bold">{nf(p.amount)}</div>
            </Row>
          ))}
          {planItems.length === 0 && <Empty text="尚未設定定期定額配置" />}
        </div>
      </Panel>

      <Panel title="新增定期定額項目">
        <div className="grid grid-cols-2 gap-2">
          <Field label="標的"><input value={form.symbol}
            onChange={(e) => setForm({ ...form, symbol: e.target.value })} placeholder="0050" className="input" /></Field>
          <Field label="月投入金額"><input type="number" value={form.amount}
            onChange={(e) => setForm({ ...form, amount: e.target.value })} className="input" /></Field>
          <div className="col-span-2">
            <Field label="備註"><input value={form.note}
              onChange={(e) => setForm({ ...form, note: e.target.value })} className="input" /></Field>
          </div>
        </div>
        <AddButton onClick={add} label="新增項目" />
      </Panel>
