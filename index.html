      <Panel title="資料備份與還原">
        <div className="rounded-xl p-3 flex gap-2 items-start"
          style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
          <ShieldCheck size={18} style={{ color: COLORS.gold, flex: "0 0 auto", marginTop: 1 }} />
          <div className="text-[11px] leading-5" style={{ color: COLORS.sub }}>
            JSON 用來完整備份／還原 App；Excel 用來保存、檢視與分析投資歷史。重要修改後建議兩種都留一份。
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-3">
          <button onClick={exportBackup}
            className="rounded-xl py-2.5 text-[11px] font-bold flex items-center justify-center gap-1"
            style={{ background: COLORS.gold, color: COLORS.bg }}>
            <Download size={14} /> JSON備份
          </button>
          <label className="rounded-xl py-2.5 text-[11px] font-bold flex items-center justify-center gap-1 cursor-pointer"
            style={{ background: COLORS.bg, color: COLORS.gold, border: `1px solid ${COLORS.gold}` }}>
            <Upload size={14} /> JSON還原
            <input type="file" accept="application/json,.json" className="hidden"
              onChange={(e) => {
                const file = e.target.files?.[0];
                importBackup(file);
                e.target.value = "";
              }} />
          </label>
          <button onClick={exportExcel}
            className="rounded-xl py-2.5 text-[11px] font-bold flex items-center justify-center gap-1"
            style={{ background: COLORS.bg, color: COLORS.gold, border: `1px solid ${COLORS.gold}` }}>
            <Download size={14} /> 匯出Excel
          </button>
        </div>
      </Panel>
    </div>
  );
}

// ---------------- Progress Panel ----------------
function ProgressPanel({ planSchedule, setPlanSchedule, planTotal, schedule, totalInvested, totalToday,
  principalCrossing, assetCrossing, elapsedMonths, leadMonths }) {

  const principalDate = principalCrossing ? addMonths(planSchedule.startDate, principalCrossing.index) : "—";
  const assetDate = assetCrossing ? addMonths(planSchedule.startDate, assetCrossing.index) : "—";
  const principalBeyond = principalCrossing?.beyond;
  const assetBeyond = assetCrossing?.beyond;

  return (
    <div className="space-y-4">
      <Panel title="計畫進度追蹤">
        <div className="grid grid-cols-2 gap-3">
          <div className="rounded-xl p-3" style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
            <div className="text-[11px]" style={{ color: COLORS.sub }}>成本進度</div>
            <div className="text-lg font-bold mono mt-1">{principalDate}{principalBeyond ? "+" : ""}</div>
            <div className="text-[11px] mono mt-1" style={{ color: COLORS.sub }}>
              目前持倉成本 NT$ {nf(totalInvested)}
            </div>
          </div>
          <div className="rounded-xl p-3" style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
            <div className="text-[11px]" style={{ color: COLORS.sub }}>資產進度</div>
            <div className="text-lg font-bold mono mt-1">{assetDate}{assetBeyond ? "+" : ""}</div>
            <div className="text-[11px] mono mt-1" style={{ color: COLORS.sub }}>
              實際資產 NT$ {nf(totalToday)}
            </div>
          </div>
        </div>

        <div className="mt-3 rounded-xl p-3 flex items-center justify-between"
          style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
          <span className="text-xs" style={{ color: COLORS.sub }}>資產領先成本進度</span>
          <span className="text-lg font-bold mono"
            style={{ color: leadMonths >= 0 ? COLORS.gain : COLORS.loss }}>
            {leadMonths == null ? "—" : `${leadMonths >= 0 ? "+" : ""}${leadMonths.toFixed(1)} 個月`}
          </span>
        </div>
        <div className="mt-2 text-[11px] mono" style={{ color: COLORS.sub }}>
          計畫已執行約 {elapsedMonths.toFixed(1)} 個月（自 {planSchedule.startDate}）
        </div>
        {(principalBeyond || assetBeyond) && (
          <div className="mt-2 text-[11px]" style={{ color: COLORS.gold }}>
            已超出目前推算年限，請拉長下方「推算年限」以看到精確月份。
          </div>
        )}
      </Panel>

      <Panel title="計畫參數設定">
        <div className="grid grid-cols-2 gap-2">
          <Field label="計畫開始日"><input type="date" value={planSchedule.startDate}
            onChange={(e) => setPlanSchedule({ ...planSchedule, startDate: e.target.value })}
            className="input" /></Field>
          <Field label="起始本金"><input type="number" value={planSchedule.initialCapital}
            onChange={(e) => setPlanSchedule({ ...planSchedule, initialCapital: Number(e.target.value) })}
            className="input" /></Field>
          <Field label="每月投入金額">
            <input type="number" value={planSchedule.monthlyAmount}
              onChange={(e) => setPlanSchedule({ ...planSchedule, monthlyAmount: Number(e.target.value) })}
              className="input" />
          </Field>
          <Field label="假設年化報酬率(%)"><input type="number" step="0.1" value={planSchedule.annualReturn}
            onChange={(e) => setPlanSchedule({ ...planSchedule, annualReturn: Number(e.target.value) })}
            className="input" /></Field>
          <div className="col-span-2">
            <Field label="推算年限(年)"><input type="number" value={planSchedule.horizonMonths / 12}
              onChange={(e) => setPlanSchedule({ ...planSchedule, horizonMonths: Number(e.target.value) * 12 })}
              className="input" /></Field>
          </div>
        </div>
        <button onClick={() => setPlanSchedule({ ...planSchedule, monthlyAmount: planTotal })}
          className="mt-3 w-full rounded-xl py-2 text-xs font-bold"
          style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}`, color: COLORS.gold }}>
          帶入「計畫設定」目前每月定期定額合計（NT$ {nf(planTotal)}）
        </button>
      </Panel>

      <Panel title={`每月本金與資產推算（共 ${schedule.length} 筆）`}>
        <div className="grid grid-cols-4 gap-1 text-[10px] font-bold px-2 pb-1.5" style={{ color: COLORS.sub }}>
          <div>月份</div>
          <div className="text-right">累積本金</div>
          <div className="text-right">推算資產</div>
          <div className="text-right">資產-本金</div>
        </div>
        <div className="space-y-1.5 max-h-96 overflow-y-auto">
          {schedule.map((row) => {
            const isCurrent = Math.round(elapsedMonths) === row.index;
            const gap = row.assets - row.principal;
            return (
              <div key={row.index}
                className="grid grid-cols-4 gap-1 rounded-lg px-2 py-1.5 text-[11px] mono items-center"
                style={{
                  background: isCurrent ? "rgba(201,162,75,0.12)" : COLORS.bg,
                  border: `1px solid ${isCurrent ? COLORS.gold : COLORS.panelBorder}`,
                }}>
                <div style={{ color: isCurrent ? COLORS.gold : COLORS.text }}>
                  {row.index === 0 ? "起點" : addMonths(planSchedule.startDate, row.index)}
                  {isCurrent && <span className="ml-1 text-[9px]" style={{ color: COLORS.gold }}>●目前</span>}
                </div>
                <div className="text-right" style={{ color: COLORS.sub }}>{nf(row.principal)}</div>
                <div className="text-right">{nf(row.assets)}</div>
                <div className="text-right" style={{ color: gap >= 0 ? COLORS.gain : COLORS.loss }}>
                  {gap >= 0 ? "+" : ""}{nf(gap)}
                </div>
              </div>
            );
          })}
        </div>
      </Panel>
    </div>
  );
}

// ---------------- shared bits ----------------
function Panel({ title, children }) {
  return (
    <div className="rounded-2xl p-4" style={{
      background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`,
      boxShadow: "0 4px 16px rgba(0,0,0,0.28)",
    }}>
      <div className="text-xs font-bold mb-3" style={{ color: COLORS.sub }}>{title}</div>
      {children}
    </div>
  );
}
function Field({ label, children }) {
  return (
    <label className="block">
      <div className="text-[10px] mb-1" style={{ color: COLORS.sub }}>{label}</div>
      {children}
      <style>{`
        .input {
          width: 100%; background: ${COLORS.bg}; border: 1px solid ${COLORS.panelBorder};
          color: ${COLORS.text}; border-radius: 10px; padding: 8px 10px; font-size: 13px;
          outline: none; font-family: 'JetBrains Mono', monospace;
        }
        .input:focus { border-color: ${COLORS.gold}; }
      `}</style>
    </label>
  );
}
function AddButton({ onClick, label }) {
  return (
    <button onClick={onClick} className="mt-3 w-full flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-sm font-bold"
      style={{ background: COLORS.gold, color: "#0A0F1C" }}>
      <Plus size={16} /> {label}
    </button>
  );
}
function Row({ children, onDelete }) {
  return (
    <div className="flex items-center gap-2 rounded-xl p-2.5" style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
      {children}
      <button onClick={onDelete} style={{ color: COLORS.sub }}><TrashIcon size={14} /></button>
    </div>
  );
}
function Empty({ text }) {
  return <div className="text-center text-xs py-6" style={{ color: COLORS.sub }}>{text}</div>;
}

function TabBar({ tab, setTab }) {
  return (
    <div className="fixed bottom-0 left-0 right-0"
      style={{
        background: COLORS.panel, borderTop: `1px solid ${COLORS.panelBorder}`,
        paddingBottom: "env(safe-area-inset-bottom, 4px)",
      }}>
      <div className="max-w-2xl mx-auto flex">
        {TABS.map(({ id, label, icon: Icon }) => {
          const active = tab === id;
          return (
            <button key={id} onClick={() => setTab(id)}
              className="flex-1 flex flex-col items-center justify-center gap-0 py-0.5 px-0.5 min-w-0"
              style={{
                color: active ? COLORS.gold : COLORS.sub,
                borderTop: active ? `2px solid ${COLORS.gold}` : "2px solid transparent",
              }}>
              <Icon size={13} />
              <span className="text-[8px] font-medium whitespace-nowrap leading-tight">{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------------- defaults (first run) ----------------
function defaultHoldings() {
  // 乾淨版：不內建個人持股，請自行於「持股進度」新增
  return [];
}
function defaultTrades() {
  // 乾淨版：不內建個人交易紀錄，請自行於「交易紀錄」新增
  return [];
}
function defaultDividends() {
  // 乾淨版：不內建個人配息紀錄，請自行於「配息」新增
  return [];
}
function defaultDailyRecords() {
  return DAILY_SEED.map((r) => ({ id: uid(), ...r }));
}
function defaultPlan() {
  // 乾淨版：不內建個人定期定額配置，請自行於「計畫設定」新增
  return [];
}
function defaultPlanSchedule() {
  // 乾淨版：不內建個人資本規劃，請自行於「計畫設定」調整
  return {
    startDate: todayStr(),
    initialCapital: 0,
    monthlyAmount: 0,
    annualReturn: 8,
    horizonMonths: 120,
  };
}
